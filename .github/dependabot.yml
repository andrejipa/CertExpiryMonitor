version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Cuiaba"
    open-pull-requests-limit: 5

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Cuiaba"
    open-pull-requests-limit: 5

  - package-ecosystem: "nuget"
    directory: "/tests/CertExpiryMonitor.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:45"
      timezone: "America/Cuiaba"
    open-pull-requests-limit: 5
